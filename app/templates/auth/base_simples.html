<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Biblioteca Municipal de Cristópolis{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="entrada">
    <main class="entrada__cartao" id="conteudo">
        <div class="entrada__marca">
            <span class="sidebar__brand-icon" aria-hidden="true">📚</span>
            <span>Biblioteca Cristópolis</span>
        </div>

        {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
        <div class="alert alert--{{ categoria }}" role="{{ 'alert' if categoria == 'error' else 'status' }}">{{ mensagem }}</div>
        {% endfor %}

        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
